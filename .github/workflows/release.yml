name: Release

# Publier une release GitHub avec un tag semver (ex. 1.0.0).
# Prérequis : manifest.json.version == tag (sans préfixe v).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version sync
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/ouvertures/manifest.json'))['version'])")
          echo "tag=${TAG} manifest=${MANIFEST_VERSION}"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Le tag ($TAG) doit être identique à manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Verify brand assets
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          brand = Path("custom_components/ouvertures/brand")
          assert Image.open(brand / "icon.png").size == (256, 256)
          assert Image.open(brand / "icon@2x.png").size == (512, 512)
          logo = Image.open(brand / "logo.png")
          assert min(logo.size) >= 128, logo.size
          logo2 = Image.open(brand / "logo@2x.png")
          assert min(logo2.size) >= 256, logo2.size
          print("Brand assets OK")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
